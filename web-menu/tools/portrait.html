<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { buildIdleClip } from '../src/idle.js';
const q = new URLSearchParams(location.search);
const url = q.get('m'); const stance = q.get('s')||'ready'; const mode = q.get('mode')||'portrait';
const W=+(q.get('w')||512),H=+(q.get('h')||512);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setClearColor(0x000000,0); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x556699, 1.4));
const dl = new THREE.DirectionalLight(0xfff2dd, 2.2); dl.position.set(1.5,3,3); scene.add(dl);
const rim = new THREE.DirectionalLight(0x88aaff, 1.2); rim.position.set(-2,2,-2); scene.add(rim);
new GLTFLoader().load(url, (g) => {
  const root = g.scene; scene.add(root);
  let box = new THREE.Box3().setFromObject(root); let size = box.getSize(new THREE.Vector3());
  root.scale.setScalar(1.6 / size.y);
  const mixer = new THREE.AnimationMixer(root);
  const idle = buildIdleClip(root, g.animations, {stance});
  mixer.clipAction(idle).play(); mixer.setTime(0.4);
  root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); size = box.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, W/H, 0.01, 100);
  if (mode === 'portrait') {
    // frame head + shoulders: top 45% of the model
    root.rotation.y = -0.45; root.updateMatrixWorld(true);
    // measure the actual head from skinned vertices weighted to Head-ish bones
    root.traverse(o=>{ if(o.isSkinnedMesh) o.skeleton.update(); });
    const hb = new THREE.Box3();
    root.traverse(o=>{
      if(!o.isSkinnedMesh) return;
      const bones=o.skeleton.bones; const headIdx=new Set(); bones.forEach((b,i)=>{ if(/head/i.test(b.name)) headIdx.add(i); });
      const pos=o.geometry.attributes.position, si=o.geometry.attributes.skinIndex, sw=o.geometry.attributes.skinWeight;
      const v=new THREE.Vector3();
      for(let i=0;i<pos.count;i++){
        let w=0; for(let k=0;k<4;k++){ if(headIdx.has(si.getComponent(i,k))) w+=sw.getComponent(i,k); }
        if(w>0.6){ o.getVertexPosition(i, v); v.applyMatrix4(o.matrixWorld); hb.expandByPoint(v); }
      }
    });
    const hc=hb.getCenter(new THREE.Vector3()); const hs=hb.getSize(new THREE.Vector3());
    const headH=hs.y;
    const focus=new THREE.Vector3(hc.x, hc.y - headH*0.02, hc.z);
    const dist=headH*3.3;
    cam.position.set(focus.x, focus.y + dist*0.10, focus.z + dist); cam.lookAt(focus);
  } else {
    cam.position.set(c.x - 0.6, c.y + 0.25, c.z + 4.2); cam.lookAt(c.x, c.y, c.z);
  }
  renderer.render(scene, cam);
  window.__done = true;
});
</script></body></html>
