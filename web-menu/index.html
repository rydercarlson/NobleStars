<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1338">
  <title>Nobles Brawl</title>
  <link rel="icon" href="assets/ui/icons/nobles_shield.png">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div id="bg"></div>

      <!-- 3D brawler on stage -->
      <div id="brawler-view">
        <div class="shadow"></div>
        <canvas></canvas>
        <div class="tap-hint">TAP TO ATTACK · DRAG TO SPIN</div>
      </div>

      <!-- Home HUD -->
      <div id="home">
        <div id="team" class="hud">
          <div class="team-slot left">
            <button class="friend-bubble" id="friend-bubble" data-sfx="click"><span class="status">ONLINE</span><span class="name" id="friend-bubble-name">Bulldog_Ben</span></button>
            <button class="slot-btn" data-team="1" data-sfx="click"><span>+</span></button>
          </div>
          <div class="team-slot right">
            <button class="slot-btn" data-team="2" data-sfx="click"><span>+</span></button>
          </div>
          <button id="skins-btn" class="plate clickable" data-open="skins" data-sfx="click"><img data-slot="icons.hanger" alt="Skins"></button>
        </div>

        <!-- top bar: trophy road · profile · currencies · menu -->
        <button id="trophy-btn" class="hud plate clickable" data-open="trophyRoad" data-sfx="click">
          <img data-slot="icons.trophy" alt="">
          <div class="info">
            <div class="v num" id="player-trophies">0</div>
            <div class="bar"><i id="trophy-progress"></i></div>
            <div class="next" id="trophy-next">next: 1,000</div>
          </div>
        </button>
        <button id="profile-btn" class="hud plate clickable" data-sfx="click">
          <img class="shield" data-slot="icons.shield" alt="">
          <div class="info">
            <div class="name t" id="player-name">GUEST</div>
            <div class="xp"><i id="player-xp"></i><b id="player-level">LVL 6</b></div>
          </div>
        </button>

        <div id="currency" class="hud">
          <button class="currency plate clickable" data-open="shop" data-sfx="click" title="Power Points"><img data-slot="icons.power_point" alt=""><span class="v num" id="cur-pp">0</span><span class="plus">+</span></button>
          <button class="currency plate clickable" data-open="shop" data-sfx="click" title="Coins"><img data-slot="icons.coin" alt=""><span class="v num" id="cur-coins">0</span><span class="plus">+</span></button>
          <button class="currency plate clickable" data-open="shop" data-sfx="click" title="Gems"><img data-slot="icons.gem" alt=""><span class="v num" id="cur-gems">0</span><span class="plus">+</span></button>
          <button class="currency plate clickable" data-open="shop" data-sfx="click" title="Bling"><img data-slot="icons.bling" alt=""><span class="v num" id="cur-bling">0</span></button>
        </div>

        <button id="btn-menu" class="img-btn" data-open="menu" data-sfx="click"><img data-slot="buttons.menu" alt="Menu"></button>

        <!-- left stack: pass · shop · brawlers -->
        <div class="hud col-left">
          <button class="img-btn side-btn pass" data-open="pass" data-sfx="click"><img data-slot="buttons.nobles_pass" alt="Nobles Pass"><span class="dot alert hidden" id="pass-dot">!</span></button>
          <button class="img-btn side-btn" data-open="shop" data-sfx="click"><img data-slot="buttons.shop" alt="Shop"><span class="timer-tag" id="shop-timer">23h 59m</span></button>
          <button class="img-btn side-btn" data-open="brawlers" data-sfx="click"><img data-slot="buttons.brawlers" alt="Brawlers"></button>
        </div>

        <!-- right stack: quests · friends · club · inbox -->
        <div class="hud col-right">
          <button class="side-btn plate-btn" data-open="quests" data-sfx="click"><img data-slot="icons.quests" alt=""><span class="lbl t outline hair">QUESTS</span><span class="dot hidden" id="quests-dot"></span></button>
          <button class="img-btn side-btn" data-open="friends" data-sfx="click"><img data-slot="buttons.friends" alt="Friends"><span class="dot hidden" id="friends-dot"></span></button>
          <button class="img-btn side-btn" data-open="club" data-sfx="click"><img data-slot="buttons.club" alt="Club"></button>
          <button class="img-btn side-btn" data-open="inbox" data-sfx="click"><img data-slot="buttons.inbox" alt="Inbox"><span class="dot hidden" id="inbox-dot"></span></button>
        </div>

        <div id="bottom" class="hud">
          <div id="search-status" class="hidden"><span class="t outline thin" id="search-text">SEARCHING FOR PLAYERS 1/10</span><div class="found-row" id="found-row"></div></div>
          <button id="mode-btn" class="plate clickable" data-open="modes" data-sfx="click">
            <div class="icon"><img data-slot="icons.bulldog" alt="" id="mode-icon"></div>
            <div class="txt">
              <div class="name t outline thin" id="mode-name">SHOWDOWN</div>
              <div class="sub t outline hair" id="mode-sub">Solo</div>
            </div>
            <div class="tab"></div>
          </button>
          <div class="event-timer" id="event-timer">Ends in 1h 21m</div>
          <button id="play-btn" class="img-btn" data-sfx="play"><img data-slot="buttons.play" alt="Play"></button>
          <button id="cancel-btn" class="btn red big hidden" data-sfx="back">CANCEL</button>
        </div>
      </div>

      <div id="screens"></div>
      <div id="toasts"></div>
      <div class="fx-layer" id="fx"></div>

      <div id="loader">
        <div class="keyart" id="loader-art"></div>
        <div class="vignette"></div>
        <div class="loader-ui">
          <img class="logo" id="loader-logo" alt="Nobles Brawl">
          <div class="logo-text t outline" id="loader-logo-text">NOBLES<b>BRAWL</b></div>
          <div class="bar"><i id="load-bar"></i><span class="pct" id="load-pct">0%</span></div>
          <div class="tip" id="load-tip">Warming up the auditorium…</div>
        </div>
        <div class="version">v0.5 · menu prototype</div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
